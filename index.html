<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IELTS Practice – Luyện thi IELTS</title>
  <meta name="description" content="Luyện tập IELTS 4 kỹ năng: Reading, Listening, Writing, Speaking, kèm từ vựng và theo dõi tiến độ.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#" class="brand"><span class="logo">IE</span> <span>IELTS Practice</span></a>
    <nav class="mainnav" id="mainnav" aria-label="Menu chính"></nav>
    <div class="top-actions">
      <a href="#wallet" class="wallet-chip" id="walletChip" title="Số dư"></a>
      <details class="acct-menu" id="acctMenu">
        <summary class="avatar" id="avatarBtn" aria-label="Tài khoản"></summary>
        <div class="dropdown right" id="acctDropdown"></div>
      </details>
      <button class="theme-btn" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện">◐</button>
      <button class="menu-btn" aria-label="Mở menu" aria-expanded="false" aria-controls="drawer">☰</button>
    </div>
  </header>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Menu" hidden>
    <div class="drawer-head"><strong id="drawerName"></strong><button class="drawer-close" id="drawerClose" aria-label="Đóng menu">✕</button></div>
    <div id="drawerBody"></div>
  </aside>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    Nội dung luyện tập do trang tự soạn, chỉ mang tính tham khảo. Điểm band là ước tính, không phải điểm chính thức.
  </footer>

  <script src="data.js"></script>
  <script src="data-extra.js"></script>
  <script src="app.js"></script>
</body>
</html>
